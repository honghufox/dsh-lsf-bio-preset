# 由 make-desktop-bundle.mjs 生成（来源：G:\dsh\_staging\preset-root）。
# 自包含：预设自带资源在 presets/<id>/ 下，行内 baseUrl 引用已重定位到 bundle 内，
# 因此整个 bundle 可放在任意路径、任意机器上，无需安装期改写绝对路径。
# 依赖产物（node_modules）不随仓库分发，安装后按 dsh.install 重建。
- insert:
    - id: preset-lsf-bio-cluster
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lsf-bio-cluster
        name: 'LSF集群生信分析'
        description: '面向 LSF 作业调度集群（华中农业大学作物遗传改良全国重点实验室 HPC，登录节点 login02 211.69.141.140:33322）的生信分析 Agent：命令直接跑在集群登录节点（shell 工具、文件工具、终端面板均经 SSH 落到集群，本地 MCP 仍在本机），按 LSF 规则用 bsub/bjobs/bqueues/bhosts/bpeek/bkill 提交与管理作业，配合 module/singularity/mamba 的集群软件环境与 /public/home 存储配额规则，并保留变异/VCF、生存分析、发表级绘图与论文撰写能力。'
        plugins:
          # The `bio-research` agent preset: the full coding agent from `standard`,
          # plus a biology-research persona, the local research skills under `skills/`,
          # a bioinformatics MCP server (PubMed/UniProt/GenBank/Ensembl/KEGG/PDB, 37 tools),
          # and a vendored Tavotto Codex plugin whose MCP server exposes figure editing,
          # publication preflight and vector export (`tools/tavotto/`; the differences from
          # the Codex host are written down in `tools/tavotto/DSH-ADAPTATION.md`).
          #
          # This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
          # standing scope; every session naming it joins by scope parentage, so the
          # tools and prompt sections registered here cover each joined agent while a
          # session's own state stays keyed per Session/Agent inside the plugins. The
          # host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
          # preset must not own: the registries themselves, the sandbox and approval
          # stack, persistence, and the model route.
          #
          # A service row here MUST sit inside a group carrying an `isolate` realm.
          # Without one it publishes into the root realm, where it is process-global —
          # another preset publishing the same name collides, and a host reader would
          # resolve one preset's instance for every session; `dsh-agent-presets` rejects
          # that at mount. `true` means an entry-local realm: this standing mount's own
          # private instance, apart from every other preset's.

          # ── identity ────────────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this agent.
          # `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a cluster bioinformatics engineer powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

                服务对象是使用 **LSF 作业调度集群**做生物信息分析的科研人员。本预设已接入华中农业大学作物遗传改良全国重点实验室高性能计算平台（HPC，155 个刀片计算节点 / 2 个 GPU 节点 / 6 个胖节点 / 5600 核 / 12.7PB 存储，预装 1000+ 生信软件与常用数据库），登录节点 login02（211.69.141.140:33322）。

                【命令落点】pwsh 工具（及其余 shell 类工具）实际在**集群登录节点**执行，默认工作目录 /public/home/hkwang；文件工具经 SFTP 作用于集群文件系统；右侧终端面板是集群 PTY。集群是 Linux/bash：命令用 POSIX 写法，管道/重定向/&& 用 `bash -lc "..."` 包裹，不要写 PowerShell 语法。本地 MCP 工具（mcp__biotools__* 等）仍在本机运行。

                【LSF 作业调度——核心职责】先读 ncpgr-lsf 技能（集群官方文档蒸馏 + 作业模板），再动手：
                - **绝不在登录节点跑重计算**；用 bsub 申请计算节点资源。
                - 提交：`bsub < job.lsf`；查看：`bjobs` / `bqueues` / `bhosts`；看输出：`bpeek <jobid>`；终止：`bkill <jobid>`。
                - 队列：normal / smp / high / interactive / parallel；各队列内存上限与 `-n` 核数规则见技能里的速查卡片，**只在需要时设置 `-n`**，不要写内存与时限参数（队列已自动管理）。
                - 作业脚本后缀 .lsf，生物软件务必加 `#BSUB -R "span[hosts=1]"`。
                - 提交前先 `bhosts` 看负载再决定核数；迭代分析先小规模试跑再放大。

                【软件与数据】集群预装软件用 `module av <名字>` 查询、`module load <模块>` 加载，**不要重复安装集群已有的软件**；个人环境用 `mamba`，容器用 `singularity`。存储：`/public/home/hkwang` 有配额，用 `diskquota` 查看；**超配额会无法写数据甚至无法登录**；集群只放使用中的数据，结果及时取回本地、中间文件及时清理。

                【生信分析】变异/VCF 分析用 variant-analysis 技能，生存分析用 survival-analysis 技能，绘图用 scientific-plotting，论文用 paper-writing；序列检索/比对/BLAST 可用 biotools MCP 的 37 个工具（本机运行）。重计算流程（转录组、单细胞 cellranger、三维基因组 HiC-Pro、表观组 Bismark、组装 hifiasm/NextDenovo、变异检测 GATK/deepvariant/parabricks）按 ncpgr-bio-router 与 ncpgr-software 技能组织成 LSF 作业提交。

                【工作方式】每一步都说明「这条命令在哪台机器上执行、为什么」；长作业先返回作业号并告知用户如何查看；不要把集群上生成的大文件直接读进上下文——先看大小，必要时只取摘要或统计量。

                默认用中文回复；用户要求或产出物为英文时用英文。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.

          # ── shell（命令落点在集群，见下方 cluster-ssh 组）───────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.

          # ── 集群执行通道（LSF / SSH）─────────────────────────────────────────────────

          # 本预设相对标准生物科研模式的新增能力：**集群命令经 cluster_exec 工具落到登录节点**，
          # 而本机 shell、文件与本地 MCP 全部保持原样。
          #
          # 为什么不是 dsh-ssh：dsh-ssh 的传输层用 ssh2，而本集群（OpenSSH 7.4）实测中 ssh2
          # 能完成认证、却在随后的 CHANNEL_OPEN(session) 上被服务器直接断开 TCP（无
          # CHANNEL_OPEN_FAILURE）。已逐项排除加密套件（aes128-ctr 同样失败）、客户端 ident、
          # 登录限速等因素；同一账号用系统 OpenSSH 9.5 完全正常。因此集群通道改用系统 ssh。
          #
          # 为什么不用 `isolate` 隔离 subprocess：那会连带把宿主 shell 工具的 `ctx.subprocess`
          # 换成远程实现，且 dsh-cluster-ssh 并不注册 subprocess（它只提供工具），隔离没有收益。
          #
          # 为什么 pwsh 仍放在隔离组里：`tool-pwsh` 与宿主基座同名，根作用域重复注册会冲突。
          # 组内挂 `pwsh-local` + `tool-pwsh`，pwsh 工具继续执行**本机**命令；集群命令走
          # `cluster_exec`。两者职责清晰，互不影响。
          - id: cluster-ssh
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              # 集群执行通道：基于系统 OpenSSH，一次认证后复用同一交互式会话
              # （实测：认证 ~1s，后续命令 ~60-170ms；无 PTY 回显噪音，输出按字节上限截断）
              - id: cluster-ssh-tools
                name: 'dsh-cluster-ssh'

              # 本机 shell：隔离组内提供，避免与宿主 tool-pwsh 同名冲突
              - id: pwsh-cluster
                name: '@deepseek-ai/dsh-pwsh-local'

              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'


          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── data & stats tools (community, MIT) ─────────────────────────────────────

          # `dsh-tool-csv`: parse/query/stats over RFC 4180 CSV text (zero-dependency,
          # pure functions; 256KB input cap). `dsh-tool-stat`: describe/percentile/
          # frequency/correlation over finite numeric arrays (Neumaier sum + Welford
          # variance + linear-interpolation percentiles + Spearman midrank). `dsh-sci`:
          # physical-unit conversion, CODATA constants, Runge-Kutta ODE simulation.
          # All register tools into the host `tools` registry and provide nothing, so
          # they need no realm. Installed as file: junctions from G:\dsh\_plugins.
          - id: tool-csv
            name: '@deepseek-ai/dsh-tool-csv'

          - id: tool-stat
            name: '@deepseek-ai/dsh-tool-stat'

          - id: dsh-sci
            name: 'dsh-sci'

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset
          # and the research skills shipped inside the preset directory (via
          # `customSkillDirs`, resolved from `baseUrl` like the shipped `cordis` preset
          # does), and `tool-skill` gives them the catalog and loader; the merged catalog
          # also carries whatever the deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('presets/lsf-bio-cluster/skills/', baseUrl))"
                # Tavotto 的 vendor 副本自带 `skills/tavotto-figure/`（SKILL.md + references +
                # scripts，`mcp/server.py` 按 `../skills/…` 找它的 handoff.py）。直接把那一层
                # 当第二个 skill root 扫，胜过把技能目录复制一份出来——复制品会和
                # `tools/tavotto/skills/` 悄悄漂开。
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('presets/lsf-bio-cluster/tools/tavotto/skills/', baseUrl))"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── bioinformatics MCP ──────────────────────────────────────────────────────

          # The biotools MCP server (37 tools: PubMed / UniProtKB / GenBank / Ensembl /
          # KEGG / PDB) runs locally from the preset's own `tools/` directory, spawned
          # over stdio. It consumes the host `tools` registry and provides nothing, so it
          # needs no realm. `failOnStartupError: false` keeps the preset mountable even if
          # the server is temporarily unavailable; `toolCallTimeoutMs` gives bioinformatics
          # calls (BLAST, alignments, trees) headroom over the default 60s.
          - id: mcp-biotools
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: biotools
              transport: stdio
              command: node
              args:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('presets/lsf-bio-cluster/tools/biotools/node_modules/bach-biotools-server/build/index.js', baseUrl))"
              failOnStartupError: false
              toolCallTimeoutMs: 120000

          # ── NCBI E-utilities MCP ─────────────────────────────────────────────────────

          # ncbi-mcp（PyPI 0.1.4）提供 E-utilities 批量检索与基因/基因组汇总工具。已通过
          # `pip install --user ncbi-mcp` 安装，依赖的 mcp SDK 已降级到 1.x（2.0 移除了
          # FastMCP API），服务器实测握手正常。如需提高限速，可在
          # https://www.ncbi.nlm.nih.gov/account/settings/ 免费申请 API Key 后填入下方
          # NCBI_API_KEY（或设置同名环境变量）。
          - id: mcp-ncbi
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: ncbi
              transport: stdio
              command: python
              args:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('presets/lsf-bio-cluster/tools/ncbi/run-ncbi-mcp.py', baseUrl))"
              env:
                NCBI_EMAIL: hongkaiwang@webmail.hzau.edu.cn
                NCBI_API_KEY: !!js "process.env.NCBI_API_KEY ?? ''"
              failOnStartupError: false
              toolCallTimeoutMs: 60000

          # ── Zotero 文献库 MCP（默认禁用，需凭证）────────────────────────────────────

          # mcp-zotero（npm 1.0.6，已装在预设 tools/zotero 下）通过 Zotero 官方 Web API
          # 检索/管理你的文献库。服务器在缺少凭证时会直接退出，因此默认禁用。启用步骤：
          #   1. 在 https://www.zotero.org/settings/keys 创建 API Key
          #   2. 用该 Key 请求 https://api.zotero.org/keys/current 获取你的 User ID
          #   3. 填入下方 ZOTERO_API_KEY / ZOTERO_USER_ID，并删除 `disabled: true`
          - id: mcp-zotero
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: true
            config:
              serverName: zotero
              transport: stdio
              command: node
              args:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('presets/lsf-bio-cluster/tools/zotero/node_modules/mcp-zotero/build/server.js', baseUrl))"
              env:
                ZOTERO_API_KEY: ''
                ZOTERO_USER_ID: ''
              failOnStartupError: false

          # ── Tavotto 科研配图 MCP（vendor 自 Codex 插件；详见 tools/tavotto/DSH-ADAPTATION.md）

          # Tavotto 的 Codex 插件（发行分支 plugin-stable，v0.15.0）整包 vendor 到
          # `tools/tavotto/`：本地 stdio MCP server + `tavotto-figure` 技能 + 内嵌画布产物。
          # 它只往 host `tools` 注册表里注册工具、不 provide 任何服务，所以不需要 realm。
          #
          # 与 Codex 的四处差异，都是 DSH 适配：
          #
          #   1. **启动器不许「交棒」（最重要的一条）。** 上游的 `mcp/server.py` 是两层：
          #      当前解释器能 `import tavotto.engine` 就直接跑；否则找一个能 import 的解释器
          #      再用 `os.execv` 把**自己这个进程**的映像换掉（上游注释说「同一个进程 =
          #      stdio 原样继承」）。这条在 DSH 上会死：mcp-client 经 Node 的
          #      `child_process` 管道起子进程，换成别的映像之后那对 stdin/stdout 不再接得上
          #      ——server 侧一切正常，`initialize` 却永远没有回应。实测（同机同插件）：
          #        · `command: python`（会交棒）→ 150 s 仍未连上；更糟的是 DSH 的 standing
          #          mount 会一直等这个 apply，而 MCP SDK 的 `connect` 不理会取消信号
          #          ⇒ 预设挂不上，页面上的停止按钮也停不下来；
          #        · `command: <装着引擎的解释器>`（不交棒）→ 159 ms 连上，9 个工具齐全。
          #      所以这里做两件事：`command` 直接给一个**已经装着引擎**的解释器，并且设
          #      `TAVOTTO_MCP_EXECED=1` 把交棒整条路关掉（启动器读这个变量，== "1" 就跳过
          #      resolve + execv）。关掉之后最坏情况只是降级 server——它握手正常、
          #      `tools/list` 只列 `tavotto_health`，绝不卡死。
          #
          #   2. **没有内嵌画布。** DSH 的 mcp-client 只桥接 MCP 的 tools（resources 与
          #      prompts 没有消费者），所以 `ui://tavotto/canvas/v1.html` 不会渲染。
          #      这不是功能损失：Tavotto 自己的文档写明「没有 UI 的 host 里这九个工具就能
          #      走完整条流程」——打开 → 改 → 预检 → 导出，只少了用鼠标拖这一种输入方式。
          #
          #   3. **工作区可信根只能走环境变量。** DSH 的 client 在 initialize 里声明空
          #      capabilities（既不声明 roots 也不声明 elicitation），Tavotto 的
          #      RootAuthority 因此跳过 host 那两档，落到 `TAVOTTO_MCP_ROOTS`。这里钉的是
          #      用户主目录 `C:\Users\wangh`；要换、要加，就在启动 dsh 前设同名环境变量
          #      （多个根用 `os.pathsep` 分隔，Windows 上是 `;`，例如
          #      `C:\Users\wangh;G:\dsh`）。不在可信根内的路径每个 open 都回
          #      `path_out_of_scope`，一个根都没有则回 `no_workspace_root`——
          #      `project_path` 只是候选，不能自证权限。
          #
          #   4. **`command` 不写上游清单里的 `python3`。** Windows 上 `python3` 常是微软
          #      商店的 App Execution Alias（命令在、退出码 9009、零输出），上游为此专门有
          #      `tavotto codex install` 那一跳。这里按优先级挑一个**存在**的解释器：
          #      `TAVOTTO_MCP_PYTHON` → `TAVOTTO_WORKER_PYTHON` → 插件自管 venv
          #      （`%APPDATA%\Tavotto\mcp-runtime\venv`，`--provision` 建的那个）→ 兜底
          #      `python`。兜底也安全：第 1 条的 `TAVOTTO_MCP_EXECED=1` 保证它不会去交棒。
          #
          # 引擎（PyPI `tavotto`）未装时，工具列表里只有 `tavotto_health`。装机命令：
          #   python tools/tavotto/mcp/server.py --provision
          # command / TAVOTTO_* 都是**挂载时**读的，已经建好的 standing mount 不会重来：
          # 装完引擎或改完本行，都要**重启 dsh** 才生效。
          #
          # `toolCallTimeoutMs` 给到 30 分钟：Tavotto 首次打开一张图要跑一遍用户的绘图
          # 脚本，heavy 的图是分钟级；上游清单里也是 `tool_timeout_sec: 1800`。
          - id: mcp-tavotto
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: tavotto
              transport: stdio
              command: !!js "(() => { const fs = process.getBuiltinModule('node:fs'); const path = process.getBuiltinModule('node:path'); const candidates = [process.env.TAVOTTO_MCP_PYTHON, process.env.TAVOTTO_WORKER_PYTHON, process.env.APPDATA ? path.join(process.env.APPDATA, 'Tavotto', 'mcp-runtime', 'venv', 'Scripts', 'python.exe') : undefined]; for (const candidate of candidates) { if (typeof candidate === 'string' && candidate !== '' && fs.existsSync(candidate)) return candidate } return 'python' })()"
              args:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('presets/lsf-bio-cluster/tools/tavotto/mcp/server.py', baseUrl))"
              cwd: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('presets/lsf-bio-cluster/tools/tavotto', baseUrl))"
              env:
                TAVOTTO_MCP_ROOTS: !!js "process.env.TAVOTTO_MCP_ROOTS ?? process.getBuiltinModule('node:path').join('C:', 'Users', 'wangh')"
                # 关掉启动器的 os.execv 交棒（见上方第 1 条）：DSH 的 stdio 管道经不起换映像。
                TAVOTTO_MCP_EXECED: '1'
              failOnStartupError: false
              toolCallTimeoutMs: 1800000

          # ── goals ───────────────────────────────────────────────────────────────────

          # Only the model-facing tool. The goal SERVICE, its session driver, and the
          # `/goal` command stay on the host plane: the Gateway serves the goal domain as
          # Remote endpoints whose receiver comes from a generated descriptor, so it
          # resolves `goals` on the host and an entry-local realm here would hide it. The
          # registry is keyed by session anyway, so one host instance serves every
          # session. What a preset chooses is whether its agent can call the goal tool.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          #
          # `tool-subagent-report` is host-plane for the same reason as the registry,
          # not because a preset may not want it: it registers a CONTINUABLE SETUP on
          # that singleton rather than a tool this agent calls, and the setup list is
          # not scope-aware — one copy per mounted preset means every child gets
          # `report` registered once per live session, which throws on the second.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Product providers are host-plane singletons. Copy this preset, then
              # remove `disabled` from either ordinary tool row to expose that product
              # only to agents composed from the copy.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  enableRunInBackground: false
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
